name: Build Storage Spaces

# builds the obfuscated mod zip with MCP 7.2 via MCPCommit
# pushing a tag like v1.2 also publishes the zip as a GitHub release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.mcp.outputs.artifact-name }}
      version: ${{ steps.mcp.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Storage Spaces is a Kirmod plugin and compiles against Kirmod's sources (see omnimcp.json)
      - name: Check out Kirmod
        uses: actions/checkout@v4
        with:
          repository: Korwith/Kirmod
          path: kirmod

      - id: mcp
        uses: Korwith/MCPCommit@main
        with:
          config: omnimcp.json
          artifact-name: mod_KirmodStorageSpaces-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/mod_KirmodStorageSpaces-${{ needs.build.outputs.version }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Storage Spaces ${{ needs.build.outputs.version }} for 1.3.2" \
            --generate-notes
