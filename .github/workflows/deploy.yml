name: Build Storage Spaces

# Builds the obfuscated mod zip with MCP 7.2 on every commit.
# Pushing a tag like v1.2 also publishes the zip as a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # MCP 7.2 is written for Python 2.7, which current runner images no longer ship.
    container: python:2.7.18-buster
    outputs:
      zip_name: ${{ steps.build.outputs.zip_name }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Storage Spaces is a Kirmod plugin and compiles against Kirmod's sources.
      - name: Check out Kirmod
        uses: actions/checkout@v4
        with:
          repository: Korwith/Kirmod
          path: kirmod

      # Minecraft 1.3.2 targets Java 6; MCP compiles with -source/-target 1.6, which JDK 8 still accepts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache MCP download
        uses: actions/cache@v4
        with:
          path: build/mcp72.zip
          key: mcp72-393a4ec7e18baf0e

      - name: Decompile, recompile and reobfuscate
        id: build
        run: ./ci/build.sh

      - name: Upload mod zip
        uses: actions/upload-artifact@v4
        with:
          name: mod_KirmodStorageSpaces-${{ steps.build.outputs.version }}-${{ github.sha }}
          path: dist/${{ steps.build.outputs.zip_name }}
          if-no-files-found: error

      - name: Upload MCP logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-logs
          path: build/mcp/logs/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod_KirmodStorageSpaces-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/${{ needs.build.outputs.zip_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Storage Spaces ${{ needs.build.outputs.version }} for 1.3.2" \
            --generate-notes
